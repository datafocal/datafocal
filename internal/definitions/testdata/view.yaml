apiVersion: openslo/v1
kind: SLO
metadata: {name: checkout-availability, displayName: Checkout availability}
spec:
  service: checkout
  timeWindow: [{duration: 1d, isRolling: true}]
  objectives: [{target: 0.99}]
  indicator:
    spec:
      ratioMetric:
        total: {metricSource: {type: DataFocal, spec: {query: '{service="checkout"}'}}}
        good: {metricSource: {type: DataFocal, spec: {query: '{service="checkout"} | status < 500'}}}
---
apiVersion: datafocal/v1
kind: View
metadata: {name: checkout, displayName: Checkout}
spec:
  time: {from: now-6h, to: now}
  variables:
    - {name: service, column: service, default: checkout, allowAll: true}
    - {name: level, column: level}
  panels:
    - title: Requests by status
      kind: timeseries
      query: 'sum by (status) (count_over_time({service="$service"}[1m]))'
      grid: {x: 0, y: 0, w: 8, h: 4}
    - {kind: slo, slo: checkout-availability, grid: {x: 8, y: 0, w: 4, h: 4}}
    - {kind: stat, query: 'count_over_time({service = "$service", level != "$level"} [1h])', grid: {x: 0, y: 4, w: 3, h: 2}}
    - {kind: table, query: 'topk(5, sum by (path) (count_over_time({service="$service"} [1h])))', grid: {x: 3, y: 4, w: 9, h: 2}}
    - {kind: patterns, query: '{service="$service"} | patterns', grid: {x: 0, y: 6, w: 6, h: 6}}
    - {kind: lines, query: '{service="$service", level="$level"}', grid: {x: 4, y: 6, w: 8, h: 6}}
