# Weekly update pull requests for the Go modules, the web workspace and the pinned Actions.
# Minor and patch updates are grouped into one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      go-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      # Together, and apart from web-minor: pr.yml and perf.yml run in the Playwright image
      # named by @playwright/test's version, so this bump moves CI's browsers too.
      playwright:
        patterns: ["@playwright/test", "playwright-core"]
      web-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
